spring:
  application:
    name: dopamine-shop-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # схема управляется только Flyway-миграциями
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
