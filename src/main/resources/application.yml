spring:
  application:
    name: dopamine-shop-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/dopamine_shop
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate   # схема управляется только Flyway-миграциями
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-prod-min-32-chars-long}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30

logging:
  level:
    com.dopamineshop: DEBUG
