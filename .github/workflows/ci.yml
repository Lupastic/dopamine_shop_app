name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check Docker for PostgreSQL integration test
        run: docker info
      - name: Test backend with PostgreSQL
        run: ./mvnw --batch-mode test
